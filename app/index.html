<style>
/* Layout: classification banner, masthead with search, filter rail + record list; profile reads as a numbered 10-part dossier. */
:root{
  --bg:#eef1f0; --surface:#fbfcfb; --sunk:#e3e8e6; --ink:#17201e; --muted:#5a6663; --line:#cdd5d2;
  --accent:#1d5a86; --accent-ink:#ffffff; --accent-soft:#dbe7f0;
  --banner:#007a33; --banner-ink:#ffffff;
  --cn:#a8382c; --ru:#34559c; --ir:#2c7149; --kp:#6f4a99; --fin:#8a6a12; --dev:#5f6b6a; --psoa:#9b3f74; --oth:#2f6f78;
  --ok:#2c7149; --warn:#9a6200; --warn-soft:#f6ead2; --bad:#a8382c; --bad-soft:#f5dfdb;
  --display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#19211f; --sunk:#0e1312; --ink:#e3eae7; --muted:#97a5a1; --line:#2c3835;
  --accent:#7db4dc; --accent-ink:#0d1a24; --accent-soft:#1d3142;
  --banner:#0f7a3c; --banner-ink:#ffffff;
  --cn:#e47d70; --ru:#8ea9e6; --ir:#79c497; --kp:#b99be0; --fin:#d9b456; --dev:#a3b0ae; --psoa:#e08cbd; --oth:#7cc3cc;
  --ok:#79c497; --warn:#e2b056; --warn-soft:#3a2f17; --bad:#e47d70; --bad-soft:#3b211d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#19211f; --sunk:#0e1312; --ink:#e3eae7; --muted:#97a5a1; --line:#2c3835;
  --accent:#7db4dc; --accent-ink:#0d1a24; --accent-soft:#1d3142;
  --banner:#0f7a3c; --banner-ink:#ffffff;
  --cn:#e47d70; --ru:#8ea9e6; --ir:#79c497; --kp:#b99be0; --fin:#d9b456; --dev:#a3b0ae; --psoa:#e08cbd; --oth:#7cc3cc;
  --ok:#79c497; --warn:#e2b056; --warn-soft:#3a2f17; --bad:#e47d70; --bad-soft:#3b211d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{background:var(--banner);color:var(--banner-ink);text-align:center;font:600 12px/1 var(--mono);letter-spacing:.14em;padding-block:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.mast{border-bottom:1px solid var(--line);background:var(--surface);padding-block:18px 16px}
.mast-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:end}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,4.4vw,44px)/1 var(--display);letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
.mast-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.search{grid-column:1/-1;display:flex;gap:8px;align-items:center}

.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .n{font-family:var(--mono);font-size:12px;margin-left:4px}
main{max-width:1240px;margin:0 auto;padding-block:20px 60px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);display:grid;gap:18px}

.facet button:hover{background:var(--sunk)}
.facet button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);font-weight:600}

.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:0}
.c-CN{--cc:var(--cn)} .c-RU{--cc:var(--ru)} .c-IR{--cc:var(--ir)} .c-KP{--cc:var(--kp)} .c-FIN{--cc:var(--fin)} .c-DEV{--cc:var(--dev)} .c-PSOA{--cc:var(--psoa)} .c-OTH{--cc:var(--oth)} .c-ALL{--cc:var(--muted)}

.more{display:flex;justify-content:center;padding:12px}

ul.tight{margin:0;padding-left:18px} ul.tight li{margin:3px 0;max-width:72ch}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--sunk);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.mono,.mono{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .ev{position:relative;padding:0 0 14px 18px}

.assess{border-left:3px solid var(--accent);background:var(--accent-soft);padding:6px 12px;font-size:12.5px;margin-bottom:10px;border-radius:0 var(--r) var(--r) 0}
.src{font-size:13.5px}
.src .ref{font:600 12px var(--mono);color:var(--accent);margin-right:6px}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);display:grid;gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.card h4{margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toc{display:grid;gap:2px;margin:0;padding:0;list-style:none}

.st{font:500 10.5px var(--mono);letter-spacing:.04em}
.st.c{color:var(--ok)} .st.p{color:var(--warn)} .st.m{color:var(--bad)}

.alias small{display:block;font:400 10.5px var(--mono);color:var(--muted)}
/* Compare */
.cmp td,.cmp th{min-width:180px}
.cmp th:first-child,.cmp td:first-child{min-width:130px;position:sticky;left:0;background:var(--surface);z-index:1}
.cmp thead th:first-child{background:var(--sunk)}
.shared{background:var(--accent-soft);font-weight:600}
/* Admin */
.form{display:grid;gap:18px}
.fs{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:12px}
.fs legend{font:700 17px var(--display);padding:0 6px}
.f{display:grid;gap:4px}
.f label{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f small{color:var(--muted);font-size:12px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--bg);width:100%;font-size:15px}
.f textarea{min-height:90px;resize:vertical;font-size:14px}
.f textarea.code{font-family:var(--mono);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--bg);padding-block:12px;border-top:1px solid var(--line)}
.msg{font-size:13.5px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:30}
.cmpbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
.cmpbar .in{max-width:1240px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.features .feature{margin:0;grid-template-columns:minmax(0,1fr)}
.feature.c-RU{border-left-color:var(--ru)} .feature.c-IR{border-left-color:var(--ir)} .feature.c-KP{border-left-color:var(--kp)} .feature.c-FIN{border-left-color:var(--fin)} .feature.c-DEV{border-left-color:var(--dev)} .feature.c-PSOA{border-left-color:var(--psoa)} .feature.c-OTH{border-left-color:var(--oth)}
.related{display:grid;gap:4px;margin-top:8px}
.related div{font-size:13px} .related b{font-weight:600}
.exbanner{background:var(--warn-soft);color:var(--warn);font:600 12px/1.5 var(--mono);letter-spacing:.04em;padding:8px 12px;border-radius:var(--r);margin-bottom:14px}
.inject{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:grid;gap:10px}
.inject .ih{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.inject .t{font:700 20px/1.2 var(--display)}
.inject .time{font:600 13px var(--mono);color:var(--accent)}
.inject ol{margin:0;padding-left:20px} .inject li{margin:4px 0;max-width:75ch}
.inject details{border-top:1px dashed var(--line);padding-top:8px}
.inject summary{cursor:pointer;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inject details p{margin:8px 0 0;max-width:75ch;font-size:14px}
.injects{display:grid;gap:14px}
.ctx{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:grid;gap:6px}
.tac{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
footer{max-width:1240px;margin:0 auto;padding-block:0 80px;color:var(--muted);font-size:12.5px}
@media (max-width:900px){
  .layout,.dossier{grid-template-columns:minmax(0,1fr)}
  .rail,.aside{position:static}
  .rail{grid-template-columns:1fr 1fr}
  .aside{order:-1}
}
@media (max-width:560px){
  .mast-in{grid-template-columns:minmax(0,1fr)}

  .row .meter{display:none}
  .sec{grid-template-columns:minmax(0,1fr)} .sec .no{display:none} .sec .body{grid-column:1}
  .kv{grid-template-columns:minmax(0,1fr)} .diamond,.grid2{grid-template-columns:minmax(0,1fr)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script type="module">
import { compareEntry, actorNames, entryNames, normalizeName } from "./lib/galaxy.mjs";
import { createCampaignAssessmentDraft } from "./lib/campaign-assessment.mjs";
(() => {
"use strict";
const COUNTRIES = {CN:"China", RU:"Russia", IR:"Iran", KP:"North Korea", FIN:"Financially motivated", DEV:"Groups in development", PSOA:"Private-sector offensive actors", OTH:"Other nations & networks"};
const SECTIONS = [
  ["identification","Identification"],["attribution","Attribution"],["objectives","Strategic objectives"],
  ["targeting","Targeting"],["capabilities","Capabilities"],["attack","MITRE ATT&CK mappings"],
  ["campaigns","Campaign history"],["diamond","Diamond Model analysis"],["gaps","Intelligence gaps"],
  ["implications","Operational implications (JIPOE / JCC2)"],["sources","Dated authoritative sources"]
];
// The profile schema carries 10 required analytic sections plus sources; sources count toward completeness.
const S = {actors:new Map(), loaded:false, dbErr:null, country:"ALL", status:"ALL", q:"", view:"list", id:null, cmp:[], limit:60, admin:false, uid:null, editing:null, scenarios:[], inject:null};
const TACTICS = ["reconnaissance","resource-development","initial-access","execution","persistence","privilege-escalation","defense-evasion","credential-access","discovery","lateral-movement","collection","command-and-control","exfiltration","impact"];
const tacLabel = t => t.split("-").map(w=>w==="and"?"and":w[0].toUpperCase()+w.slice(1)).join(" ");
const tacRank = x => { const r=arr(x.tactics).map(t=>TACTICS.indexOf(t)).filter(i=>i>=0); return r.length?Math.min(...r):99; };
let db = null, user = null, siteMode = false, research = null, researchDraft = false;
const $ = s => document.querySelector(s);
const app = $("#app");

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : null;
const s = v => (typeof v === "string" ? v.trim() : "");
const arr = v => Array.isArray(v) ? v : [];
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

/* ---------- completeness ---------- */
const DATE_RE = /^((19|20)\d{2})(?:-(\d{2})(?:-(\d{2}))?)?(?:\s*\([^)]+\))?$/;
const CITE_RE = /\[(S\d+|R-[0-9a-f]{8}-\d+|MS|M)\]/g;
function validDate(v){
  const m = DATE_RE.exec(s(v));
  if (!m) return false;
  if (m[3]){
    const mo = Number(m[3]);
    if (mo < 1 || mo > 12) return false;
    if (m[4]){
      const iso = `${m[1]}-${m[3]}-${m[4]}`;
      const d = new Date(`${iso}T00:00:00Z`);
      if (Number.isNaN(d.getTime()) || d.toISOString().slice(0,10) !== iso) return false;
    }
  }
  return true;
}
function secState(a, key){
  switch(key){
    case "identification": return s(a.identification?.summary) ? (s(a.identification?.firstObserved) ? "c" : "p") : "m";
    case "attribution": { const t=a.attribution||{}; const n=[t.sponsor,t.confidence,t.basis].filter(s).length; return n===3?"c":n?"p":"m"; }
    case "objectives": return s(a.objectives) ? "c" : "m";
    case "targeting": { const t=a.targeting||{}; return arr(t.sectors).length && arr(t.regions).length ? "c" : (arr(t.sectors).length||arr(t.regions).length||s(t.notes)) ? "p" : "m"; }

    case "diamond": { const d=a.diamond||{}; const n=["adversary","capability","infrastructure","victim"].filter(k=>s(d[k])).length; return n===4?"c":n?"p":"m"; }
    case "gaps": return arr(a.gaps).filter(s).length ? "c" : "m";
    case "implications": { const i=a.implications||{}; return s(i.jipoe)&&s(i.jcc2)?"c":(s(i.jipoe)||s(i.jcc2))?"p":"m"; }
    case "sources": { const src=arr(a.sources); if(!src.length) return "m"; return src.every(x=>s(x.ref)&&s(x.title)&&s(x.publisher)&&safeUrl(x.url)&&validDate(x.date)) ? "c" : "p"; }

const states = a => SECTIONS.map(([k]) => secState(a,k));
const isComplete = a => states(a).every(x => x==="c");
const STL = {c:"Complete", p:"Partial", m:"Research Required"};

/* ---------- search ---------- */
function flatText(a){
  const parts=[a.primaryName,a.country,COUNTRIES[a.country],a.mitreGroupId,a.msName];
  arr(a.aliases).forEach(x=>parts.push(x.name,x.vendor));
  const walk=v=>{ if(typeof v==="string") parts.push(v); else if(Array.isArray(v)) v.forEach(walk); else if(v&&typeof v==="object") Object.values(v).forEach(walk); };
  ["identification","attribution","objectives","targeting","capabilities","attack","campaigns","diamond","gaps","implications","sources"].forEach(k=>walk(a[k]));
  return parts.filter(Boolean).join(" • ").toLowerCase();
}
const idxCache = new WeakMap();
function idx(a){ let v=idxCache.get(a); if(!v){ v=flatText(a); idxCache.set(a,v);} return v; }
function matchSections(a, terms){
  const hits=[];
  for (const [k,label] of SECTIONS){ const v=a[k]; const t=JSON.stringify(v||"").toLowerCase(); if (terms.some(q=>t.includes(q))) hits.push(label); }
  const names=[a.primaryName,...arr(a.aliases).map(x=>x.name)].join(" ").toLowerCase();
  if (terms.some(q=>names.includes(q))) hits.unshift("Name / alias");
  return hits;
}
function filtered(){
  const terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list=[...S.actors.values()];
  if (S.country!=="ALL") list=list.filter(a=>a.country===S.country);
  if (S.status==="C") list=list.filter(isComplete); else if (S.status==="RR") list=list.filter(a=>!isComplete(a)); else if (S.status==="FLAG") list=list.filter(a=>arr(a.importFlags).length);
  if (terms.length) list=list.filter(a=>{ const t=idx(a); return terms.every(q=>t.includes(q)); });
  const score=a=>{ if(!terms.length) return 0; const n=[a.primaryName,...arr(a.aliases).map(x=>x.name)].join(" ").toLowerCase(); return terms.every(q=>n.includes(q)) ? -1 : 0; };
  list.sort((x,y)=> (y.featured?1:0)-(x.featured?1:0) || score(x)-score(y) || states(y).filter(v=>v==="c").length-states(x).filter(v=>v==="c").length || x.primaryName.localeCompare(y.primaryName));
  return {list, terms};
}

function val(id){ return document.getElementById(id)?.value ?? ""; }
async function save(msg){
  const name=val("f-name").trim();
  if (!name){ msg.className="msg err"; msg.textContent="Add a primary name before saving."; return; }
  const gid=val("f-gid").trim();
  if (gid && !/^G\d{4}$/.test(gid)){ msg.className="msg err"; msg.textContent="MITRE group ID must match G#### (e.g. G1017)."; return; }
  const prev=S.editing;
  const id=prev?.id || slug(name);
  if (!prev && S.actors.has(id)){ msg.className="msg err"; msg.textContent=`A profile with the id "${id}" already exists. Open and edit it instead.`; return; }
  const camp=pipes(val("f-camp"),["date","name","summary","sources"]).map(c=>({...c, sources:c.sources?c.sources.split(",").map(x=>x.trim()).filter(Boolean):[]}));
  const srcs=pipes(val("f-src"),["ref","date","publisher","title","url"]).filter(x=>x.url||x.title||x.ref);
  const refs=new Set();
  for (const src of srcs){
    if (!safeUrl(src.url)){ msg.className="msg err"; msg.textContent=`Source ${src.ref||src.title||"(unnamed)"} requires an http(s) URL.`; return; }
    if (s(src.date) && !validDate(src.date)){ msg.className="msg err"; msg.textContent=`Source ${src.ref||src.url} has an invalid date "${src.date}". Use YYYY-MM-DD, YYYY-MM, or YYYY.`; return; }
    if (s(src.ref)){
      if (refs.has(src.ref)){ msg.className="msg err"; msg.textContent=`Duplicate source ref "${src.ref}". Give each source a unique ref.`; return; }
      refs.add(src.ref);
    }
  }
  for (const c of camp){
    if (!s(c.name) || !s(c.summary)){ msg.className="msg err"; msg.textContent="Every campaign entry requires both a name and a summary."; return; }
    for (const sr of c.sources) if (!refs.has(sr)){ msg.className="msg err"; msg.textContent=`Campaign "${c.name}" cites unknown source ref "${sr}".`; return; }
  }
  const doc={
    ...(prev||{}), id, primaryName:name, msName:val("f-ms").trim(), country:val("f-country"), mitreGroupId:gid,
    aliases:pipes(val("f-aliases"),["name","vendor"]).filter(x=>x.name),
    identification:{summary:val("f-summary").trim(), firstObserved:val("f-first").trim(), notes:val("f-idnotes").trim()},
    attribution:{sponsor:val("f-sponsor").trim(), confidence:val("f-conf").trim(), basis:val("f-basis").trim()},
    objectives:val("f-obj").trim(),
    targeting:{sectors:lines(val("f-sectors")), regions:lines(val("f-regions")), notes:val("f-tnotes").trim()},
    capabilities:{summary:val("f-capsum").trim(), software:pipes(val("f-sw"),["id","name","type"]).filter(x=>x.name||x.id)},
    attack:pipes(val("f-attack"),["id","name","source"]).filter(x=>x.id).map(x=>({...arr(prev?.attack).find(t=>t.id===x.id),...x})),
    campaigns:camp,
    diamond:{adversary:val("f-dadv").trim(), capability:val("f-dcap").trim(), infrastructure:val("f-dinf").trim(), victim:val("f-dvic").trim(), socioPolitical:val("f-dsp").trim(), technology:val("f-dtech").trim()},
    gaps:lines(val("f-gaps")),
    implications:{jipoe:val("f-jipoe").trim(), jcc2:val("f-jcc2").trim()},
    sources:srcs,
    updatedAt:new Date().toISOString(), updatedBy:S.uid||"",
    provenance: prev?.provenance || {origin:"admin"},
  };
  const {sources:_s, provenance:_p, ...bodyFields} = doc;
  for (const m of JSON.stringify(bodyFields).matchAll(CITE_RE)){
    if (!refs.has(m[1])){ msg.className="msg err"; msg.textContent=`Profile text cites [${m[1]}] which is not in the sources list.`; return; }
  }
  if (!prev) { doc.importFlags=[]; doc.msCandidates=[]; }
  msg.className="msg"; msg.textContent="Saving…";
  try{
    if (siteMode) {
      const result = await siteRequest(prev ? "PUT" : "POST", {actor:doc, expectedRevision:prev?._revision || 0});
      Object.assign(doc, result.actor);
    } else await db.doc("actors/"+id).set(JSON.parse(JSON.stringify(doc)));
    if (!siteMode) try{ await db.collection("audit").add({actorId:id, action:prev?"edit":"create", at:doc.updatedAt, by:S.uid||""}); }catch(_){}
    S.actors.set(id, doc); S.editing=null; S.view="profile"; S.id=id; history.replaceState(null,"","#"+id); render(); toast(prev?"Profile saved":"Profile created");
  }catch(e){ msg.className="msg err"; msg.textContent = siteMode ? e.message : e?.code==="invalid_argument" ? "Save refused. Only editors of this encyclopedia can change profiles." : e?.code==="quota_exceeded" ? "Storage is full. Delete unused profiles, then save again." : "Save failed. Check your connection and try again."; }
}
function confirmDelete(btn,id,msg){
  if (btn.dataset.armed!=="1"){ btn.dataset.armed="1"; btn.textContent="Confirm delete"; msg.className="msg err"; msg.textContent="This permanently removes the profile for every viewer."; return; }
  (siteMode ? siteRequest("DELETE", {id, expectedRevision:S.actors.get(id)?._revision || 0}) : db.doc("actors/"+id).delete()).then(async()=>{ if (!siteMode) try{ await db.collection("audit").add({actorId:id,action:"delete",at:new Date().toISOString(),by:S.uid||""}); }catch(_){} S.actors.delete(id); S.cmp=S.cmp.filter(x=>x!==id); go("list"); toast("Profile deleted"); })
    .catch(e=>{ msg.textContent=siteMode ? e.message : "Delete failed. Only editors can delete profiles."; });
}

/* ---------- research review ---------- */
const researchActive = job => job && ["starting","queued","in_progress"].includes(job.status);
async function researchRequest(path, body){
  const response=await fetch("/api/research"+path,{method:body?"POST":"GET",cache:"no-store",...(body?{headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{})});
  let result;
  try{result=await response.json();}catch(_){throw new Error("Research could not be reached. Please try again.");}
  if(!response.ok) throw new Error(result.error||"Research failed. Please try again.");
  return result.job;
}
async function openResearch(id){
  clearTimeout(openResearch.timer);
  research={actorId:id,focus:"",job:null,error:"",loading:true,selected:new Set()};
  const current=research;
  S.view="research"; S.id=id; render(); window.scrollTo(0,0);
  try{current.job=await researchRequest("?actor="+encodeURIComponent(id));}
  catch(e){current.error=e.message;}
  current.loading=false;
  if(research===current && S.view==="research") render();
  if(researchActive(current.job)) pollResearch(current);
}
async function pollResearch(current){
  if(research!==current || !researchActive(current.job)) return;
  openResearch.timer=setTimeout(async()=>{
    try{current.job=await researchRequest("?job="+encodeURIComponent(current.job.id));current.error="";}
    catch(e){current.error=e.message;}
    if(research===current && S.view==="research") render();
    if(researchActive(current.job)) pollResearch(current);
  },5000);
}
async function startResearch(){
  const current=research;
  if(current.loading || researchActive(current.job)) return;
  current.loading=true;current.error="";current.selected=new Set();render();
  try{current.job=await researchRequest("",{actorId:current.actorId,focus:current.focus,requestId:crypto.randomUUID()});}
  catch(e){current.error=e.message;}
  current.loading=false;
  if(research===current && S.view==="research") render();
  if(researchActive(current.job)) pollResearch(current);
}
function researchCited(text, sources){
  return String(text).split(/(\[R[^\]\s]*\]|\[S\d+\])/g).map(part=>{
    const source=sources.find(x=>("["+String(x.ref||"").replace(/^\[|\]$/g,"")+"]")===part);
    return source && safeUrl(source.url) ? h("a",{href:source.url,target:"_blank",rel:"noopener noreferrer"},part) : part;
  });
}
function researchValue(value,sources){
  const labels={firstObserved:"First observed",summary:"Summary",notes:"Notes",socioPolitical:"Socio-political axis",jipoe:"JIPOE",jcc2:"JCC2"};
  if(value==null || value==="" || Array.isArray(value)&&!value.length) return h("span",{class:"note"},"No content");
  if(typeof value==="string") return h("p",{style:"white-space:pre-wrap"},...researchCited(value,sources));
  if(Array.isArray(value)) return h("ul",{class:"tight"},value.map(item=>h("li",{},researchValue(item,sources))));
  return h("div",{},Object.entries(value).filter(([,v])=>v!=="" && (!Array.isArray(v)||v.length)).map(([key,val])=>h("div",{},h("strong",{},labels[key]||key.replace(/([A-Z])/g," $1").replace(/^./,c=>c.toUpperCase())),researchValue(val,sources))));
}
function renderResearch(){
  const current=research,a=S.actors.get(current.actorId);
  if(!a){app.append(h("p",{},"Actor profile not found."));return;}
  const job=current.job,draft=job?.draft,busy=current.loading||researchActive(job);

      h("div",{class:"f"},h("label",{for:"research-focus"},"Research focus (optional)"),h("textarea",{id:"research-focus",rows:3,maxlength:1500,disabled:busy,oninput:e=>current.focus=e.target.value},current.focus),h("small",{},"For example: recent campaigns, attribution changes, targeting, or missing profile sections.")),
      h("button",{class:"btn primary",type:"submit",disabled:busy},busy?"Researching…":job?"Start new research":"Start research")),
    h("p",{role:"status","aria-live":"polite"},current.loading?"Loading research…":researchActive(job)?"Searching sources and preparing a draft. This can take a few minutes; you can reopen this actor’s research to check progress.":job?.status==="completed"?"Research draft ready. Your profile has not been changed.":""),
    current.error||job?.error?h("div",{class:"rr-box",role:"alert"},current.error||job.error):null));
  if(!draft)return;
  const sources=[...arr(a.sources),...draft.sources];
  const panel=h("div",{class:"form"},h("h3",{},"Review suggested changes"),h("p",{},...researchCited(draft.summary,sources)));
  if(draft.cautions.length) panel.append(h("div",{class:"rr-box"},h("strong",{},"Research cautions"),h("ul",{},draft.cautions.map(t=>h("li",{},...researchCited(t,sources))))));
  const suggestions=SECTIONS.filter(([key])=>draft.sections[key]!=null);
  if(!suggestions.length)panel.append(h("p",{},"No supported profile changes were identified. Review the sources and cautions, or try a narrower research focus."));
  for(const [key,label] of suggestions){

    h("p",{class:"note"},"Moving suggestions to the editor does not save them. Your existing sources are retained."),
    h("button",{class:"btn primary",disabled:!suggestions.length,onclick:()=>applyResearchDraft()},"Review selected changes in editor"));
  app.append(panel);

async function applyResearchDraft(){
  const current=research;
  if(!current.selected.size){current.error="Select at least one suggested section.";render();return;}
  try{
    const data=await siteRequest();
    const actor=data.actors.find(a=>a.id===current.actorId);
    if(!actor || actor._revision!==current.job.baseRevision)throw new Error("This profile changed after research started. Reload the profile and start fresh research before applying this draft.");
    const edited=structuredClone(actor);
    for(const key of current.selected)edited[key]=structuredClone(current.job.draft.sections[key]);
    edited.sources=[...arr(actor.sources),...current.job.draft.sources];
    S.actors.set(actor.id,actor);S.editing=edited;S.id=actor.id;S.view="edit";researchDraft=true;render();window.scrollTo(0,0);
  }catch(e){current.error=e.message;render();}
}

/* ---------- Galaxy analyst workbench ---------- */
let galaxy=null, galaxyError='', galaxyQuery='', galaxyEntryId=null, galaxyActorId=null, galaxyReviews=[], galaxyLoading=false, galaxyStorage=false, galaxyInputs={};
async function enrichmentRequest(body){
  const response=await fetch('/api/enrichment?actor='+encodeURIComponent(galaxyActorId||''),{method:body?'POST':'GET',cache:'no-store',...(body?{headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'Review storage unavailable.');
  return result;
}
async function openGalaxy(actorId){
  if(actorId && actorId!==galaxyActorId)galaxyEntryId=null;
  galaxyActorId=actorId||galaxyActorId||[...S.actors.keys()][0];
  S.view='galaxy';galaxyError='';galaxyLoading=true;galaxyStorage=false;galaxyReviews=[];render();
  try {
    if(!galaxy){const r=await fetch('data/enrichment/galaxy.json');if(!r.ok)throw new Error('Galaxy snapshot unavailable.');galaxy=await r.json();}
    if(siteMode){try{const result=await enrichmentRequest();galaxyReviews=result.reviews;galaxyStorage=true;}catch(e){galaxyError=e.message;}}
  }catch(e){galaxyError=e.message;}
  galaxyLoading=false;if(S.view==='galaxy')render();
}
async function galaxyAction(action,extra={}){
  const review=galaxyReviews.find(x=>x.entryId===galaxyEntryId&&x.snapshotId===galaxy.id&&!x.isStale);
  galaxyLoading=true;galaxyError='';render();
  try{
    const result=await enrichmentRequest({action,actorId:galaxyActorId,entryId:galaxyEntryId,expectedRevision:review?.revision||0,...extra});
    galaxyReviews=galaxyReviews.filter(x=>!(x.entryId===galaxyEntryId&&x.snapshotId===galaxy.id&&!x.isStale));galaxyReviews.push(result.review);
  }catch(e){galaxyError=e.message;}
  galaxyLoading=false;if(S.view==='galaxy')render();
}

  const review=galaxyReviews.find(x=>x.entryId===entry.uuid&&x.snapshotId===galaxy.id&&!x.isStale);

  if(!review){detail.append(h('button',{class:'btn',disabled:galaxyLoading,onclick:()=>galaxyAction('stage')},'Create enrichment draft'));return;}
  if(review.status==='Research Required'){

      h('label',{},'Relationship judgment ',relation),h('label',{},'Analyst rationale ',rationale),h('label',{},'Dated evidence ',evidence),h('p',{class:'note'},'URL | publication YYYY-MM-DD | accessed YYYY-MM-DD | publisher | title. Dates are analyst-verified; source commit and retrieval dates are not substitutes.'),

/* ---------- navigation ---------- */
function go(view){
  S.view=view;
  if (view==="list"){ S.id=null; S.inject=null; history.replaceState(null,"",location.pathname+location.search); }
  else if (view==="scenarios") history.replaceState(null,"","#scenarios");
  else if (view==="compare" && S.cmp.length) history.replaceState(null,"","#cmp~"+S.cmp.join("~"));
  render(); window.scrollTo(0,0);
}
function applyHash(){
  const hv=decodeURIComponent(location.hash.slice(1));
  if (!hv) return false;
  if (hv==="scenarios"){ S.view="scenarios"; return true; }
  if (hv.startsWith("cmp~")){ S.cmp=hv.split("~").slice(1).filter(id=>S.actors.has(id)).slice(0,4); S.view="compare"; return true; }
  if (S.actors.has(hv)){ S.view="profile"; S.id=hv; return true; }
  return false;
}
function openProfile(id){ S.view="profile"; S.id=id; history.replaceState(null,"","#"+id); render(); window.scrollTo(0,0); }
function toggleCmp(id){ S.inject=null; const i=S.cmp.indexOf(id); if(i>=0) S.cmp.splice(i,1); else { if(S.cmp.length>=4){ toast("Compare holds up to 4 actors"); return; } S.cmp.push(id); } render(); }
$("#btn-home").onclick=()=>go("list");
$("#btn-compare").onclick=()=>{ S.inject=null; go("compare"); };
$("#btn-galaxy").onclick=()=>openGalaxy();
$("#btn-scen").onclick=()=>go("scenarios");
$("#cmp-go").onclick=()=>go("compare");
$("#cmp-clear").onclick=()=>{S.cmp=[];render();};
$("#btn-new").onclick=()=>openEdit(null);
let qT; $("#q").addEventListener("input",e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=e.target.value.trim(); S.limit=60; if(S.view!=="list") S.view="list"; render(); },120); });
window.addEventListener("hashchange",()=>{ if (S.view!=="edit" && applyHash()){ render(); window.scrollTo(0,0); } });

$("#foot").append(h("p",{}, "UNCLASSIFIED. Open-source research aid only. For classified TTPs and current reporting, consult JWICS / SIPR holdings. Base records were imported from actors.json (MISP Galaxy, MITRE ATT&CK, Microsoft Threat Intelligence, Google TI / Mandiant). Nothing absent from that file was added to imported records except Microsoft names confirmed against Microsoft's published mapping (MicrosoftMapping.json, retrieved 2026-10-14) and ATT&CK tactic labels from MITRE's published data. Missing sections are marked Research Required."));

/* ---------- boot ---------- */
async function siteRequest(method="GET", body){
  const response = await fetch("/api/profiles", {method, cache:"no-store", headers:body?{"Content-Type":"application/json"}:{}, ...(body?{body:JSON.stringify(body)}:{})});
  if (method==="GET" && response.status===404) return null;
  if (!(response.headers.get("content-type")||"").includes("application/json")) {
    if (method==="GET" && response.ok) return null;
    throw new Error("Profile storage could not be reached. Reload the page and try again.");
  }
  const result=await response.json();
  if (!response.ok) throw new Error(result.error||"Save failed. Please try again.");
  return result;
}
async function loadSite(){
  let result;
  try{ result=await siteRequest(); }
  catch(e){
    S.dbErr=e.message; S.loaded=false; render(); return true;
  }
  if (!result) return false;
  siteMode=true;
  S.actors=new Map(result.actors.map(a=>[a.id,a]));
  S.scenarios=result.scenarios;
  S.uid=result.userId; S.admin=true; S.loaded=true;
  $("#foot").prepend(h("p",{},h("strong",{},"Your editable encyclopedia")," · Profile changes are saved to your private Site and available across devices."));
  applyHash();render();return true;
}
/* Read-only snapshot mode: used outside claude.ai (e.g. GitHub Pages), where the live database is unavailable. */
async function loadSnapshot(){
  try{
    const r = await fetch("data/bundle.json", {cache:"no-cache"});
    if (!r.ok) throw new Error(r.status);
    const b = await r.json();
    S.actors = new Map(arr(b.actors).filter(a=>a&&a.primaryName).map(a=>[a.id,a]));
    S.scenarios = arr(b.scenarios).filter(x=>x.title).sort((x,y)=>(x.order||0)-(y.order||0));
    S.loaded = true; S.admin = false;
    $("#foot").prepend(h("p",{}, h("strong",{},"Read-only snapshot"), ` exported ${s(b.exported)||"from the encyclopedia database"}. Editing and live updates are available only in the claude.ai version.`));
    applyHash(); render();
  }catch(_){ S.dbErr="Profiles could not be loaded. Open this encyclopedia on claude.ai, or check that data/bundle.json is published with this page."; S.loaded=false; render(); }
}
render();
(async () => {
  if (!window.claude?.use){ if (!await loadSite()) await loadSnapshot(); return; }
  [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (user){ try{ S.admin = !!(await user.canEdit()); S.uid = await user.id(); }catch(_){} }
  if (!db){ S.dbErr="Sign in to claude.ai with access to this encyclopedia to load profiles."; render(); return; }
  db.collection("actors").limit(1000).onSnapshot(snap=>{
    const m=new Map(); snap.docs.forEach(d=>{ const v=d.data(); if(v && v.primaryName) m.set(d.id,{...v,id:d.id}); });
    const first=!S.loaded;
    S.actors=m; S.loaded=true;
    if (first) applyHash();
    if (S.view!=="edit") render(); else { $("#cmp-n").textContent=S.cmp.length; }
  }, err=>{ S.dbErr = err?.code==="revoked" ? "Access to this encyclopedia changed. Reload the page." : "Profiles could not be loaded. Reload the page to try again."; S.loaded=false; render(); });
  db.collection("scenarios").limit(50).onSnapshot(snap=>{
    S.scenarios=snap.docs.map(d=>({...d.data(), id:d.id})).filter(x=>x.title).sort((a,b)=>(a.order||0)-(b.order||0));
    if (S.view==="scenarios") render();
  }, ()=>{});
})();
})();
